name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DecompileX
        run: |
          cmake --build build --parallel

      - name: Verify Executable
        run: |
          if (!(Test-Path "build/bin/DecompileX.exe")) {
            Write-Error "DecompileX.exe was not generated!"
            exit 1
          }

          Write-Host "Windows build successful!"

      - name: Package Build
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build/bin/DecompileX.exe" "dist/DecompileX.exe"
          Compress-Archive -Path "dist/DecompileX.exe" -DestinationPath "DecompileX-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecompileX-Windows-x64
          path: DecompileX-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error

  android:
    name: Android ARM64
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        run: |
          set -e

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install "ndk;$NDK_VERSION"

          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -f "$NDK_PATH/build/cmake/android.toolchain.cmake" ]; then
            echo "Android NDK installation failed!"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Setup Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build DecompileX
        run: |
          cmake --build build-android --parallel

      - name: Verify Executable
        run: |
          test -f build-android/bin/DecompileX
          file build-android/bin/DecompileX

      - name: Package Build
        run: |
          mkdir -p dist
          cp build-android/bin/DecompileX dist/DecompileX
          chmod +x dist/DecompileX
          cd dist
          zip -9 ../DecompileX-Android-ARM64.zip DecompileX

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecompileX-Android-ARM64
          path: DecompileX-Android-ARM64.zip
          retention-days: 30
          if-no-files-found: error
