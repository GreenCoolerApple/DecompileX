name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build DecompileX (Windows)
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build DecompileX
        run: |
          cmake --build build --config Release --parallel

      - name: Verify Executable
        run: |
          if (!(Test-Path "build/bin/DecompileX.exe")) {
            Write-Error "DecompileX.exe was not generated!"
            exit 1
          }

          Write-Host "DecompileX.exe generated successfully!"
          Get-Item "build/bin/DecompileX.exe"

      - name: Package Build
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build/bin/DecompileX.exe" "dist/DecompileX.exe"
          Compress-Archive -Path "dist/DecompileX.exe" -DestinationPath "DecompileX-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecompileX-Windows-x64
          path: DecompileX-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error
