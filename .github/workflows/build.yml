name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DecompileX
        run: |
          cmake --build build --parallel

      - name: Verify Executable
        run: |
          if (!(Test-Path "build/bin/DecompileX.exe")) {
            Write-Error "DecompileX.exe was not generated!"
            exit 1
          }

          Write-Host "Build successful!"
          Get-Item "build/bin/DecompileX.exe"

      - name: Package Build
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build/bin/DecompileX.exe" "dist/DecompileX.exe"
          Compress-Archive -Path "dist/DecompileX.exe" -DestinationPath "DecompileX-Windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecompileX-Windows-x64
          path: DecompileX-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error
